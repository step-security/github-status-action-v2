name: Build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - name: Install deps
        run: |
          npm ci

      - name: Run build
        run: |
          npm run build

      - name: Run tests
        run: |
          npm run test
