name: Tests

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      - name: Test min args
        uses: ./
        with:
          authToken: ${{ secrets.GITHUB_TOKEN }}
          state: 'success'

      - name: Test with all args except owner/repo (success)
        uses: ./
        with:
          authToken: ${{secrets.GITHUB_TOKEN}}
          context: "Test run"
          description: "Test with all args"
          target_url: "https://github.com/step-security/github-status-action-v2"
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          state: 'success'

      - name: Test failing action
        uses: ./
        with:
          authToken: ${{secrets.GITHUB_TOKEN}}
          context: "Test run failed"
          description: "Failed test"
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          state: 'failure'

      - name: Test failing action now succeeded
        uses: ./
        with:
          authToken: ${{secrets.GITHUB_TOKEN}}
          context: "Test run failed"
          description: "Failed test now succeeded"
          sha: ${{ github.event.pull_request.head.sha || github.sha }}
          state: 'success'
